name: lpg_distribution_app
description: A digital platform for domestic LPG distribution business.

version: 1.1.1

environment:

  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # UIz
  lottie: ^3.1.2
  cupertino_icons: ^1.0.5
  flutter_screenutil: ^5.8.4
  flutter_localizations:
    sdk: flutter
  intl: '>=0.19.0 <0.21.0'
  json_annotation: ^4.9.0
  flutter_novu: ^1.0.1

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  provider: ^6.0.5

  # Network
  dio: ^5.3.2
  internet_connection_checker: ^1.0.0+1
  http: ^1.2.2

  # Storage
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0

  # Utilities
  get_it: ^7.6.0
  uuid: ^4.5.0

  # Images
  image_picker: ^1.0.4
  photo_view: ^0.14.0
  path: ^1.8.3
  tus_client_dart: ^2.5.0
  sunmi_printer_plugin: ^1.0.1

  # Bluetooth Printing
  flutter_blue_plus: ^1.31.7
  shimmer: ^3.0.0

  # Analytics and Monitoring
  # firebase_analytics: ^10.4.4  # REMOVED - Not used in codebase
  firebase_crashlytics: ^4.1.3
  mobile_scanner: ^5.2.3

  # Notifications
  firebase_messaging: ^15.1.3
  firebase_core: ^3.8.1
  flutter_local_notifications: ^18.0.0
  flutter_secure_storage: ^8.0.0
  package_info_plus: ^4.2.0
  flutter_downloader: ^1.11.5
  open_file: ^3.5.4
  device_info_plus: ^9.1.0
  flutter_pdfview: ^1.3.2

  #permissions:
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0
  geolocator: ^12.0.0
  url_launcher: ^6.3.1
  google_maps_flutter: ^2.9.0
  google_maps_flutter_android: ^2.14.0

  # Audio Recording
  record: ^5.1.2
  audioplayers: ^6.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.3
  mockito: ^5.4.2
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/images/app_icon.png
    - assets/lottie/home.json
    - assets/lottie/orders.json
    - assets/lottie/cash.json
    - assets/lottie/inventory.json
    - assets/lottie/profile.json
    - assets/credentials/
    - lib/l10n/

  # Using Flutter's default Roboto fonts to reduce app size (~500KB savings)

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon_1.png"

dependency_overrides:
  record_linux: ^1.3.0
  geolocator_android: ^5.0.0